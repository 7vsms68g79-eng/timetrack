<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>TimeTrack</title>
  <meta name="description" content="Arbeitszeit, Überstunden und Urlaub im Blick.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="TimeTrack">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#211A12">
  <meta name="format-detection" content="telephone=no">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/svg+xml" href="icons/icon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
  <script>
    // Dark Mode vor dem ersten Zeichnen setzen, damit nichts hell aufblitzt
    (function () {
      var t = 'auto';
      try { t = JSON.parse(localStorage.getItem('timetrack:v1')).settings.theme || 'auto'; } catch (e) {}
      var dark = t === 'dark' || (t !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
    })();
  </script>
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div class="statusbar" aria-hidden="true"></div>
  <header id="top" class="top"></header>
  <main id="main" class="main"></main>
  <nav id="tabbar" class="tabbar" aria-label="Bereiche"></nav>
  <div id="sheet-root"></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <noscript><p style="padding:24px">TimeTrack braucht JavaScript.</p></noscript>
  <script src="js/core.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
